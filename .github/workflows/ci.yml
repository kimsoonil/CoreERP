name: CoreERP CI
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: coreerp-${{ github.ref }}
  cancel-in-progress: true
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: JUnit + Testcontainers PostgreSQL 17
        run: ./mvnw -B verify
        working-directory: backend
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: junit-reports
          path: backend/target/surefire-reports
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci && npm test && npm run build
        working-directory: frontend
  browser:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: coreerp_demo
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: disposable-ci-only
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DB_URL: jdbc:postgresql://localhost:5432/coreerp_demo
      DB_USER: postgres
      DB_PASSWORD: disposable-ci-only
      APP_ADMIN_PASSWORD: ci-admin-password-only
      APP_DEMO_PASSWORD: ci-demo-password-only
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: ./mvnw -B package -DskipTests
        working-directory: backend
      - run: npm ci && npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Start demo API and frontend
        run: |
          java -jar backend/target/coreerp-api-1.0.0.jar --spring.profiles.active=demo > api.log 2>&1 &
          npm run dev --prefix frontend > web.log 2>&1 &
          for i in $(seq 1 60); do if curl -fsS http://127.0.0.1:5173/api/health; then exit 0; fi; sleep 2; done
          cat api.log
          exit 1
      - run: npm run test:e2e
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-results
          path: |
            frontend/test-results
            api.log
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and run actual stack
        env:
          POSTGRES_PASSWORD: disposable-container-password
          APP_ADMIN_PASSWORD: container-admin-password-only
          APP_DEMO_PASSWORD: container-demo-password-only
        run: |
          docker compose up -d --build --wait --wait-timeout 180
          curl --fail http://127.0.0.1:8088/api/health
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8088/api/products)" = 401
          docker compose down

  sql-performance:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: coreerp_perf
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: disposable-performance-only
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DB_HOST: localhost
      DB_NAME: coreerp_perf
      DB_USER: postgres
      DB_PASSWORD: disposable-performance-only
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: tools/package-lock.json
      - run: npm ci && npm run benchmark
        working-directory: tools
      - uses: actions/upload-artifact@v4
        with:
          name: sql-performance-plans
          path: docs/evidence/sql-index-benchmark.json
