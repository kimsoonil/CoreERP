server:
  port: ${PORT:8080}
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        same-site: lax
        secure: ${COOKIE_SECURE:false}
spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/coreerp}
    username: ${DB_USER:coreerp}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 12
  flyway:
    schemas: coreerp
    default-schema: coreerp
mybatis:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true
    arg-name-based-constructor-auto-mapping: true
springdoc:
  swagger-ui:
    path: /swagger-ui.html
app:
  admin-password: ${APP_ADMIN_PASSWORD:}
  demo-password: ${APP_DEMO_PASSWORD:}
---
spring:
  config:
    activate:
      on-profile: demo
  flyway:
    locations: classpath:db/migration,classpath:db/demo
